[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
# Default suite is weeksim (live frozen-week). Opt into unit: pytest tests/unit -m unit
testpaths = tests/weeksim
pythonpath = .
addopts = -m "weeksim" -v
markers =
    unit: pure domain/state tests, no cluster
    weeksim: frozen-calendar live week pipeline (default)
    io: live external API calls
    chaos: supervisor crash/recovery hooks
    slow: optional long-running checks
timeout = 3600
filterwarnings =
    ignore::DeprecationWarning
